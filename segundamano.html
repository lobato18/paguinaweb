<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segunda Mano · TecnoLobato</title>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <meta name="description" content="Compra y venta de hardware de segunda mano entre particulares. Publica gratis tu anuncio con contacto por WhatsApp.">
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lobatoDark: '#070d14',
            lobatoCard: '#0f1923',
            lobatoGreen: '#10b981',
            lobatoGold: '#d4af37'
          }
        }
      }
    }
  </script>
  <style>
    :root{ --tl-line:rgba(148,163,184,.14); }
    body{ background:linear-gradient(180deg,#050b12 0%,#07111b 45%,#050b12 100%); }
    .tl-glass{ background:linear-gradient(145deg,rgba(15,25,35,.86),rgba(7,13,20,.72)); border:1px solid var(--tl-line); box-shadow:0 24px 70px rgba(0,0,0,.28); backdrop-filter:blur(18px); }
  </style>
</head>
<body class="bg-lobatoDark text-slate-200 font-sans antialiased">
  <nav class="sticky top-0 z-40 bg-lobatoDark/95 backdrop-blur border-b border-slate-800 px-4 sm:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="index.html">
        <img src="logo.jpg" alt="TecnoLobato" class="h-11 w-11 rounded-full border-2 border-lobatoGold object-cover shadow-md">
      </a>
      <a href="index.html" class="leading-tight">
        <span class="text-xl font-black tracking-wider text-white">TECNO<span class="text-lobatoGreen">LOBATO</span></span>
        <span class="block text-[10px] tracking-widest text-slate-400 font-semibold uppercase">Servicios Informáticos</span>
      </a>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="hidden sm:inline text-slate-300 hover:text-white text-xs font-semibold px-3 py-2 rounded-lg transition">← Volver a inicio</a>
      <button id="auth-nav-btn" onclick="openAuth()" class="bg-slate-900 border border-slate-700 hover:border-lobatoGold text-slate-200 font-bold text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition">
        👤 <span id="auth-nav-label">Entrar</span>
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <div class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white">Segunda Mano</h1>
      <p class="text-slate-400 text-sm mt-2 max-w-xl mx-auto">
        Compra y venta entre particulares. Publica gratis con contacto por WhatsApp.
      </p>
      <button onclick="toggleVender()" class="mt-6 bg-lobatoGold hover:bg-amber-300 text-black font-extrabold text-xs px-6 py-3 rounded-xl transition">
        ➕ Publicar mi producto
      </button>
    </div>

    <form id="vender-form" onsubmit="submitVenta(event)" class="tl-glass rounded-2xl p-6 sm:p-8 mb-10 hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-black text-white">Nuevo anuncio</h2>
        <button type="button" onclick="toggleVender()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="block text-xs font-bold text-slate-300 mb-1">Título *</label><input id="vender-titulo" required maxlength="120" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold"></div>
        <div><label class="block text-xs font-bold text-slate-300 mb-1">Categoría *</label>
          <select id="vender-categoria" required class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold">
            <option value="">Elige...</option><option value="componentes">Componentes</option><option value="pc">PCs/portátiles</option><option value="perifericos">Periféricos</option><option value="consolas">Consolas</option><option value="moviles">Móviles</option><option value="otros">Otros</option>
          </select>
        </div>
        <div><label class="block text-xs font-bold text-slate-300 mb-1">Precio (€) *</label><input id="vender-precio" type="number" min="0" step="0.01" required class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold"></div>
        <div><label class="block text-xs font-bold text-slate-300 mb-1">Estado *</label>
          <select id="vender-estado" required class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold">
            <option value="">Elige...</option><option>Nuevo</option><option>Como nuevo</option><option>Muy bueno</option><option>Bueno</option><option>Usado</option><option>Para piezas</option>
          </select>
        </div>
        <div><label class="block text-xs font-bold text-slate-300 mb-1">Ciudad/zona *</label><input id="vender-ciudad" required maxlength="60" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold"></div>
        <div><label class="block text-xs font-bold text-slate-300 mb-1">Foto URL (opcional)</label><input id="vender-foto" type="url" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold"></div>
        <div><label class="block text-xs font-bold text-slate-300 mb-1">Tu nombre *</label><input id="vender-nombre" required maxlength="60" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold"></div>
        <div><label class="block text-xs font-bold text-slate-300 mb-1">WhatsApp/Teléfono *</label><input id="vender-telefono" required class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold"></div>
      </div>
      <div class="mt-4"><label class="block text-xs font-bold text-slate-300 mb-1">Descripción *</label><textarea id="vender-descripcion" rows="3" required maxlength="600" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:border-lobatoGold"></textarea></div>
      <label class="flex items-start gap-2 mt-4 text-[11px] text-slate-400"><input id="vender-condiciones" type="checkbox" required class="mt-0.5">Acepto que el anuncio sea visible públicamente</label>
      <button type="submit" id="vender-submit" class="mt-5 w-full bg-lobatoGold hover:bg-amber-300 text-black font-extrabold text-sm px-6 py-3 rounded-xl">Publicar gratis</button>
      <p id="vender-ok" class="hidden mt-4 text-xs text-emerald-300"></p>
    </form>

    <div class="flex flex-wrap justify-center gap-2 mb-6">
      <button onclick="filter('todas')" data-f="todas" class="fbtn bg-lobatoGold text-black font-extrabold text-xs px-4 py-2 rounded-lg">Todos</button>
      <button onclick="filter('componentes')" data-f="componentes" class="fbtn bg-slate-900 border border-slate-700 text-slate-300 text-xs px-4 py-2 rounded-lg">Componentes</button>
      <button onclick="filter('pc')" data-f="pc" class="fbtn bg-slate-900 border border-slate-700 text-slate-300 text-xs px-4 py-2 rounded-lg">PCs/portátiles</button>
      <button onclick="filter('perifericos')" data-f="perifericos" class="fbtn bg-slate-900 border border-slate-700 text-slate-300 text-xs px-4 py-2 rounded-lg">Periféricos</button>
      <button onclick="filter('consolas')" data-f="consolas" class="fbtn bg-slate-900 border border-slate-700 text-slate-300 text-xs px-4 py-2 rounded-lg">Consolas</button>
      <button onclick="filter('moviles')" data-f="moviles" class="fbtn bg-slate-900 border border-slate-700 text-slate-300 text-xs px-4 py-2 rounded-lg">Móviles</button>
      <button onclick="filter('otros')" data-f="otros" class="fbtn bg-slate-900 border border-slate-700 text-slate-300 text-xs px-4 py-2 rounded-lg">Otros</button>
    </div>

    <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div id="loading" class="text-center text-xs text-slate-500 py-6">Cargando anuncios…</div>
    <div id="empty" class="hidden text-center py-10 text-slate-400 text-sm">Aún no hay anuncios</div>
  </main>

  <div id="auth-modal" class="fixed inset-0 hidden bg-black/85 items-center justify-center p-4">
    <div class="bg-lobatoCard border border-lobatoGold/40 max-w-md w-full rounded-2xl p-6 relative">
      <button onclick="closeAuth()" class="absolute top-4 right-4 text-slate-400">✕</button>
      <h3 class="text-lg font-black text-white mb-2">Cuenta TecnoLobato</h3>
      <div class="grid grid-cols-2 gap-1 bg-slate-900 rounded-xl p-1 mb-4">
        <button onclick="tab('login')" id="t-login" class="py-2 text-xs font-extrabold rounded-lg bg-lobatoGold text-black">Entrar</button>
        <button onclick="tab('reg')" id="t-reg" class="py-2 text-xs font-extrabold rounded-lg text-slate-300">Crear cuenta</button>
      </div>
      <form id="f-login" onsubmit="login(event)"><input id="le" type="email" required placeholder="Email" class="w-full mb-2 bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2"><input id="lp" type="password" required placeholder="Contraseña" class="w-full mb-3 bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2"><button class="w-full bg-lobatoGold text-black font-extrabold text-xs py-2.5 rounded-xl">Entrar</button></form>
      <form id="f-reg" class="hidden" onsubmit="register(event)"><input id="rn" required placeholder="Nombre" class="w-full mb-2 bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2"><input id="re" type="email" required placeholder="Email" class="w-full mb-2 bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2"><input id="rp" type="password" minlength="6" required placeholder="Mín. 6 caracteres" class="w-full mb-3 bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2"><button class="w-full bg-lobatoGold text-black font-extrabold text-xs py-2.5 rounded-xl">Crear cuenta</button></form>
      <div id="auth-msg" class="hidden mt-3 text-xs"></div>
    </div>
  </div>

  <script>
    const AUTH_API="AIzaSyBHK7DC3SHgIxsPJPIhL5BH1b2ec5KWe6M";
    const SM_DB="https://tecnolobato-web-default-rtdb.firebaseio.com/segunda_mano.json";
    const CAT={componentes:"Componentes",pc:"PCs/portátiles",perifericos:"Periféricos",consolas:"Consolas",moviles:"Móviles",otros:"Otros"};
    let user=null,items=[],f="todas";
    function openAuth(){document.getElementById('auth-modal').classList.remove('hidden');}
    function closeAuth(){document.getElementById('auth-modal').classList.add('hidden');}
    function tab(t){document.getElementById('f-login').classList.toggle('hidden',t!='login');document.getElementById('f-reg').classList.toggle('hidden',t!='reg');document.getElementById('t-login').className='py-2 text-xs font-extrabold rounded-lg '+(t=='login'?'bg-lobatoGold text-black':'text-slate-300');document.getElementById('t-reg').className='py-2 text-xs font-extrabold rounded-lg '+(t=='reg'?'bg-lobatoGold text-black':'text-slate-300');}
    async function login(e){e.preventDefault();const email=document.getElementById('le').value.trim(),pass=document.getElementById('lp').value;const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+AUTH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,returnSecureToken:true})});const d=await r.json();if(!r.ok){alert(d.error?.message||'Error');return;}user={email,idToken:d.idToken};localStorage.setItem('tl-sm-user',JSON.stringify(user));document.getElementById('auth-nav-label').textContent='Mi cuenta';closeAuth();}
    async function register(e){e.preventDefault();const name=document.getElementById('rn').value.trim(),email=document.getElementById('re').value.trim(),pass=document.getElementById('rp').value;const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+AUTH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,returnSecureToken:true})});const d=await r.json();if(!r.ok){alert(d.error?.message||'Error');return;}if(name){await fetch("https://identitytoolkit.googleapis.com/v1/accounts:update?key="+AUTH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:d.idToken,displayName:name})});}user={email,idToken:d.idToken};localStorage.setItem('tl-sm-user',JSON.stringify(user));document.getElementById('auth-nav-label').textContent='Mi cuenta';closeAuth();}
    function toggleVender(){if(!user){openAuth();return;}document.getElementById('vender-form').classList.toggle('hidden');}
    function filter(cat){f=cat;document.querySelectorAll('.fbtn').forEach(b=>{const on=b.dataset.f==cat;b.className='fbtn text-xs px-4 py-2 rounded-lg '+(on?'bg-lobatoGold text-black font-extrabold':'bg-slate-900 border border-slate-700 text-slate-300');});render();}
    async function load(){try{const u=localStorage.getItem('tl-sm-user');if(u)user=JSON.parse(u);if(user)document.getElementById('auth-nav-label').textContent='Mi cuenta';}catch(e){}const r=await fetch(SM_DB);const d=r.ok?await r.json():{};items=[];for(const k in d){const it=d[k];if(!it||it.visible===false)continue;it.id=k;items.push(it);}items.sort((a,b)=>(b.creado||0)-(a.creado||0));render();}
    function render(){document.getElementById('loading').classList.add('hidden');const list=f=='todas'?items:items.filter(x=>x.categoria==f);const g=document.getElementById('grid');const e=document.getElementById('empty');if(!list.length){g.innerHTML='';e.classList.remove('hidden');return;}e.classList.add('hidden');g.innerHTML=list.map(i=>{const p=i.precio!=null?parseFloat(i.precio).toFixed(2).replace('.',',')+' €':'A consultar';const tel=(i.telefono||'').replace(/\D/g,'');const wa='https://wa.me/'+tel+'?text='+encodeURIComponent('Hola, veo tu anuncio "'+(i.titulo||'')+'"');const img=i.foto?'<img src="'+i.foto+'" class="w-full h-full object-cover" onerror="this.src=\'logo.jpg\'">':'<div class="w-full h-full flex items-center justify-center text-4xl">♻️</div>';return '<div class="bg-lobatoCard border border-slate-800 rounded-2xl overflow-hidden"><div class="h-48 bg-black">'+img+'</div><div class="p-4"><div class="flex justify-between gap-2"><h3 class="font-bold text-white">'+escape(i.titulo)+'</h3><span class="text-lobatoGold font-black whitespace-nowrap">'+p+'</span></div><p class="text-xs text-slate-400 mt-2 line-clamp-3">'+escape(i.descripcion)+'</p><div class="flex justify-between text-[11px] text-slate-500 mt-3"><span>'+escape(i.vendedor||'')+'</span><span>'+escape(i.ciudad||'')+'</span></div>'+ (tel?'<a href="'+wa+'" target="_blank" class="mt-3 block text-center bg-[#25D366] text-white font-extrabold text-xs py-2 rounded-xl">Contactar por WhatsApp</a>':'')+'</div></div>'}).join('');}
    function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));}
    async function submitVenta(e){e.preventDefault();if(!user){openAuth();return;}const payload={titulo:document.getElementById('vender-titulo').value.trim(),categoria:document.getElementById('vender-categoria').value,precio:parseFloat(document.getElementById('vender-precio').value),estadoProducto:document.getElementById('vender-estado').value,ciudad:document.getElementById('vender-ciudad').value.trim(),foto:document.getElementById('vender-foto').value.trim(),vendedor:document.getElementById('vender-nombre').value.trim(),telefono:document.getElementById('vender-telefono').value.trim(),descripcion:document.getElementById('vender-descripcion').value.trim(),autorEmail:user.email,creado:Date.now(),visible:true,fecha:new Date().toLocaleString('es-ES')};await fetch(SM_DB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});document.getElementById('vender-form').reset();document.getElementById('vender-ok').textContent='¡Anuncio publicado!';document.getElementById('vender-ok').classList.remove('hidden');load();}
    document.addEventListener('DOMContentLoaded',load);
  </script>
</body>
</html>
